<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Life">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon-192.png">
<title>Life</title>
<style>
:root{--bg:#0e0f12;--card:#17191e;--card2:#1e2128;--line:#2a2e37;--text:#eef0f3;--mute:#8c93a1;--acc:#f5b83d;--good:#4ade80;--bad:#f87171;--warn:#fbbf24;--blue:#60a5fa;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px)}
main{max-width:760px;margin:0 auto;padding:12px 16px}
h1{font-size:30px;margin:10px 0 2px;letter-spacing:-.5px}
h2{font-size:22px;margin:0}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:22px 0 8px;font-weight:600}
.sub{color:var(--mute);font-size:14px}
.top{display:flex;align-items:center;gap:10px;margin:6px 0 14px}
.back{background:none;border:0;color:var(--acc);font-size:16px;padding:8px 6px 8px 0;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
@media(min-width:620px){.grid{grid-template-columns:1fr 1fr 1fr}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;min-height:112px;display:flex;flex-direction:column;justify-content:space-between;text-decoration:none;color:inherit}
.tile:active{transform:scale(.98)}
.tile .ic{font-size:22px}
.tile .nm{font-weight:600;margin-top:6px}
.tile .big{font-size:20px;font-weight:700;margin-top:4px}
.tile .sm{font-size:13px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.row>.grow{flex:1;min-width:0}
.list .item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.list .item:last-child{border-bottom:0}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--mute);background:none;flex:none;cursor:pointer;color:var(--bg);font-weight:800}
.chk.on{background:var(--good);border-color:var(--good)}
.done .t{text-decoration:line-through;color:var(--mute)}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px 12px;font:inherit;font-size:16px}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.btn{background:var(--acc);color:#111;border:0;border-radius:10px;padding:11px 16px;font-weight:700;font-size:15px;cursor:pointer;white-space:nowrap}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.btn.sm{padding:7px 11px;font-size:13px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid #4a2626}
.icon{background:none;border:0;color:var(--mute);font-size:18px;cursor:pointer;padding:4px 6px}
.pill{display:inline-block;font-size:12px;padding:3px 8px;border-radius:999px;background:var(--card2);color:var(--mute);border:1px solid var(--line)}
.pill.good{color:var(--good);border-color:#1f4a30}.pill.warn{color:var(--warn);border-color:#4a3d1a}.pill.bad{color:var(--bad);border-color:#4a2626}.pill.blue{color:var(--blue);border-color:#1e3550}
.money{font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat .k{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.stat .v{font-size:24px;font-weight:700;margin-top:4px}
.stat .s{font-size:13px;color:var(--mute);margin-top:2px}
.stat.wide{grid-column:1/-1}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:10px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:11px;color:var(--mute)}
.bars .b i{display:block;width:100%;background:var(--acc);border-radius:5px 5px 2px 2px;min-height:2px}
.bars .b.fut i{background:var(--line)}
.empty{color:var(--mute);text-align:center;padding:26px 10px}
.gun .head{display:flex;align-items:baseline;gap:10px;cursor:pointer}
.gun .mods{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.gun .mod{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:3px 0;color:#c9ced8}
.gun .mod:first-child{color:var(--text);font-weight:600}
.note{font-size:13px;color:var(--mute);margin-top:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);border:1px solid var(--line)}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:18px}}
.modrow{display:grid;grid-template-columns:1fr 96px 34px;gap:6px;margin-bottom:6px}
.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.actions .sp{flex:1}
.login{max-width:340px;margin:18vh auto 0;text-align:center}
.login input{text-align:center;font-size:24px;letter-spacing:.4em;margin:18px 0 12px}
.err{color:var(--bad);font-size:14px;min-height:20px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translateX(-50%);background:#2b2f38;color:var(--text);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;box-shadow:0 6px 24px rgba(0,0,0,.4)}
a{color:var(--blue)}
.ev{font-size:13px;color:#c9ced8;padding:6px 0;border-top:1px solid var(--line)}
.ev small{display:block;color:var(--mute)}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px;gap:3px;margin-bottom:10px}
.seg button{flex:1;background:none;border:0;color:var(--mute);padding:8px;border-radius:8px;font:inherit;font-size:14px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--text);font-weight:600}
</style>
</head>
<body>
<main id="app"><div class="empty">Loading…</div></main>
<script src="/app.js"></script>
</body>
</html>
