<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Life">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png?v=3">
<link rel="icon" href="/icon-192.png?v=3">
<title>Life</title>
<style>
:root{--bg:#070707;--card:rgba(14,14,14,.82);--card2:rgba(28,26,22,.9);--line:rgba(212,175,55,.22);--text:#f3ede0;--mute:#9a927f;
--gold:#d4af37;--gold2:#f6dd8c;--gold3:#a87a1e;--goldg:linear-gradient(135deg,#a87a1e 0%,#f6dd8c 28%,#c9982c 52%,#fbe7a1 72%,#a87a1e 100%);
--acc:#d4af37;--good:#6fd58f;--bad:#ff7a6b;--warn:#f2c14e;--blue:#8fb8ff;--r:18px;--tab:78px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overflow-x:hidden;max-width:100%;background:#050505;color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
/* Every page fills the full screen so iOS home-screen apps pin the tab bar to the real bottom */
html{height:100%;min-height:-webkit-fill-available}
body{min-height:100vh;min-height:-webkit-fill-available;min-height:100dvh;box-sizing:border-box}
main{min-height:calc(100dvh - var(--tab) - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 18px)}
/* Carbon fiber weave, fixed behind everything */
#cf{position:fixed;inset:0;z-index:-2;background-color:#161616;
background-image:
 radial-gradient(#050505 15%,transparent 16%),radial-gradient(#050505 15%,transparent 16%),
 radial-gradient(rgba(255,255,255,.09) 15%,transparent 20%),radial-gradient(rgba(255,255,255,.09) 15%,transparent 20%),
 linear-gradient(45deg,rgba(255,255,255,.035) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.035) 75%);
background-size:14px 14px,14px 14px,14px 14px,14px 14px,7px 7px;
background-position:0 0,7px 7px,0 1px,7px 8px,0 0}
#cf::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 22%,rgba(212,175,55,.09),transparent 55%),radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.7) 100%)}
body{background:transparent;padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + var(--tab) + 18px)}
main{max-width:760px;margin:0 auto;padding:10px 16px}
h1{font-size:30px;margin:14px 0 4px;letter-spacing:-.3px;font-weight:800;background:var(--goldg);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 6s linear infinite}
h2{font-size:21px;margin:0;color:var(--gold2)}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--gold);margin:24px 0 10px;font-weight:700}
.sub{color:var(--mute);font-size:14px}
@keyframes sheen{to{background-position:-200% 0}}
@keyframes up{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 rgba(212,175,55,0)}50%{box-shadow:0 0 18px rgba(212,175,55,.35)}}
.enter>*{animation:up .5s cubic-bezier(.2,.8,.2,1) both}
.enter>*:nth-child(2){animation-delay:.04s}.enter>*:nth-child(3){animation-delay:.08s}.enter>*:nth-child(4){animation-delay:.12s}.enter>*:nth-child(5){animation-delay:.16s}.enter>*:nth-child(n+6){animation-delay:.2s}
.top{display:flex;align-items:center;gap:10px;margin:6px 0 0;min-height:36px}
.back{background:none;border:0;color:var(--gold2);font-size:16px;padding:8px 6px 8px 0;cursor:pointer}
/* Gold-edged black glass */
.card,.tile,.stat,.list{background:linear-gradient(160deg,rgba(24,22,18,.92),rgba(8,8,8,.92)) padding-box,linear-gradient(140deg,rgba(246,221,140,.55),rgba(168,122,30,.15) 40%,rgba(212,175,55,.45)) border-box;
border:1px solid transparent;border-radius:var(--r);box-shadow:0 10px 30px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,240,200,.06);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.card{padding:16px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.grid.enterTiles>.tile{animation:up .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms + .15s)}
.tile{padding:15px;cursor:pointer;min-height:122px;display:flex;flex-direction:column;justify-content:space-between;text-decoration:none;color:inherit;position:relative;overflow:hidden;transition:transform .18s ease}
.tile.wide{grid-column:1/-1;min-height:110px}
.tile::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(246,221,140,.10) 45%,transparent 60%);transform:translateX(-100%);transition:transform .8s ease}
.tile:hover::before,.tile:active::before{transform:translateX(100%)}
.tile:active{transform:scale(.965)}
.tile .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(212,175,55,.12);border:1px solid rgba(212,175,55,.3)}
.tile .ic svg{width:19px;height:19px;stroke:var(--gold2)}
.tile .nm{font-weight:700;margin-top:8px;letter-spacing:.02em;color:var(--gold2);font-size:14px;text-transform:uppercase}
.tile .big{font-size:26px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums;color:#fff}
.tile .sm{font-size:13px;color:var(--mute)}
.tile .row2{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.spark{display:flex;align-items:flex-end;gap:3px;height:34px}
.spark i{width:7px;border-radius:2px;background:var(--goldg);transform-origin:bottom;animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
.row{display:flex;align-items:center;gap:10px}
.row>.grow{flex:1;min-width:0}
.list{overflow:hidden}
.list .item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid rgba(212,175,55,.12);animation:up .4s ease both}
.list .item:last-child{border-bottom:0}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--gold3);background:none;flex:none;cursor:pointer;color:#111;font-weight:900;transition:all .2s}
.chk.on{background:var(--goldg);border-color:var(--gold2);animation:pop .35s ease}
.done .t{text-decoration:line-through;color:var(--mute)}
input,select,textarea{width:100%;background:rgba(0,0,0,.55);border:1px solid rgba(212,175,55,.28);color:var(--text);border-radius:12px;padding:12px 13px;font:inherit;font-size:16px;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.18)}
input[type=date]{color-scheme:dark}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:12px;color:var(--gold);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.08em}
.btn{background:var(--goldg);background-size:200% 100%;color:#1a1306;border:0;border-radius:12px;padding:11px 17px;font-weight:800;font-size:15px;cursor:pointer;white-space:nowrap;box-shadow:0 4px 16px rgba(212,175,55,.25);transition:transform .15s,background-position .6s}
.btn:active{transform:scale(.95);background-position:100% 0}
.btn.ghost{background:rgba(0,0,0,.45);color:var(--gold2);border:1px solid rgba(212,175,55,.4);box-shadow:none}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid rgba(255,122,107,.4);box-shadow:none}
.btn:disabled{opacity:.6}
.icon{background:none;border:0;color:var(--mute);font-size:18px;cursor:pointer;padding:4px 6px}
.pill{display:inline-block;font-size:12px;padding:3px 9px;border-radius:999px;background:rgba(0,0,0,.4);color:var(--mute);border:1px solid rgba(212,175,55,.25)}
.pill.good{color:var(--good);border-color:rgba(111,213,143,.4)}.pill.warn{color:var(--warn);border-color:rgba(242,193,78,.4)}.pill.bad{color:var(--bad);border-color:rgba(255,122,107,.4)}.pill.blue{color:var(--blue);border-color:rgba(143,184,255,.4);animation:glow 2s infinite}
.money{font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{padding:15px}
.stat .k{font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:.12em}
.stat .v{font-size:26px;font-weight:800;margin-top:4px;color:#fff}
.stat .s{font-size:13px;color:var(--mute);margin-top:2px}
.stat.wide{grid-column:1/-1}
.bars{display:flex;align-items:flex-end;gap:7px;height:140px;margin-top:10px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:5px;font-size:11px;color:var(--mute)}
.bars .b i{display:block;width:100%;background:var(--goldg);border-radius:6px 6px 2px 2px;min-height:2px;transform-origin:bottom;animation:grow .9s cubic-bezier(.2,.8,.2,1) both;box-shadow:0 0 12px rgba(212,175,55,.25)}
.bars .b.fut i{background:rgba(212,175,55,.15);box-shadow:none}
.empty{color:var(--mute);text-align:center;padding:28px 10px}
.note{font-size:13px;color:var(--mute);margin-top:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;z-index:40;animation:fade .2s}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateY(100%)}}
.sheet{background:linear-gradient(170deg,#17150f,#080808);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 16px calc(env(safe-area-inset-bottom) + 18px);border:1px solid rgba(212,175,55,.35);border-bottom:0;animation:slide .32s cubic-bezier(.2,.8,.2,1)}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:22px;border-bottom:1px solid rgba(212,175,55,.35)}}
.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.actions .sp{flex:1}
.login{max-width:360px;margin:16vh auto 0;text-align:center}
.login input{margin:18px 0 12px}
.err{color:var(--bad);font-size:14px;min-height:20px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + var(--tab) + 18px);transform:translateX(-50%);background:#16130c;color:var(--gold2);border:1px solid rgba(212,175,55,.45);padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;box-shadow:0 8px 30px rgba(0,0,0,.6);animation:up .3s}
a{color:var(--gold2)}
.ev{font-size:13px;color:#d6cfbd;padding:7px 0;border-top:1px solid rgba(212,175,55,.12)}
.ev small{display:block;color:var(--mute)}
.seg{display:flex;background:rgba(0,0,0,.55);border:1px solid rgba(212,175,55,.3);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;background:none;border:0;color:var(--mute);padding:10px 8px;border-radius:10px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:all .25s}
.seg button.on{background:var(--goldg);color:#1a1306;box-shadow:0 3px 12px rgba(212,175,55,.3)}
a.btn{text-decoration:none;display:inline-block}
/* Watch */
.watch{display:flex;justify-content:center;align-items:center;margin:18px 0 24px;min-height:clamp(220px,30vh,290px);animation:up .7s cubic-bezier(.2,.8,.2,1) both}
.watch svg{width:min(54vw,215px);height:auto;filter:drop-shadow(0 18px 30px rgba(0,0,0,.8)) drop-shadow(0 0 22px rgba(212,175,55,.12))}
.wdate{text-align:center;color:var(--gold);font-size:12px;letter-spacing:.3em;text-transform:uppercase;margin-bottom:10px}
/* ---- Home: executive ---- */
.hero{position:relative;overflow-x:clip;display:flex;flex-direction:column;align-items:center;padding:0;margin:-6px -16px 0}
.hero .spot{position:absolute;left:50%;top:50%;margin-top:calc(min(64vw,280px) / -2);width:min(64vw,280px);height:min(64vw,280px);transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(212,175,55,.16) 0%,rgba(212,175,55,.05) 38%,transparent 66%);pointer-events:none}
@keyframes breathe{50%{opacity:.6;transform:translateX(-50%) scale(.96)}}
.duo{position:relative;width:100%;height:clamp(196px,53vw,236px);overflow:clip;--W:min(55vw,228px)}
.combo{position:relative;height:100%;width:calc(var(--W) * 1.17);margin:0 auto;transform:translateX(calc(var(--W) * .0737))}
.us{margin:0;position:absolute;left:0;top:50%;transform:translateY(-50%);z-index:2;width:calc(var(--W) * .44)}
.us img{display:block;width:100%;height:auto;filter:drop-shadow(6px 10px 14px rgba(0,0,0,.85)) saturate(1.05);-webkit-touch-callout:none;user-select:none;pointer-events:none}
.hero .watch{position:absolute;right:0;top:50%;width:var(--W);margin:0;min-height:0;transform:translateY(-50%);animation:none}
.hero .watch svg{width:100%;max-width:none;height:auto;display:block;filter:none}
.qotd{margin:16px 26px 0;padding:0;text-align:center;font:italic 400 17px/1.45 "Didot","Bodoni 72",Georgia,serif;color:#efe6cf;max-width:520px;animation:up .8s .3s both}
.qotd .qm{color:var(--gold);font-size:22px;line-height:0;vertical-align:-4px;margin:0 2px}
.qotd cite{display:block;margin-top:8px;font:600 9.5px/1 -apple-system,sans-serif;font-style:normal;letter-spacing:.3em;text-transform:uppercase;color:#8d8471}
.crest{display:flex;align-items:center;gap:14px;margin-top:4px;font:500 21px/1 "Didot","Bodoni 72",Georgia,serif;letter-spacing:.42em;text-transform:uppercase;padding-left:.42em;animation:up .8s .2s both}
.crest span{background:var(--goldg);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 6s linear infinite}
.crest i{display:block;width:34px;height:1px;flex:none;background:linear-gradient(90deg,transparent,var(--gold))}
.crest i:last-child{background:linear-gradient(90deg,var(--gold),transparent)}
.lux{display:block;text-decoration:none;color:inherit;margin:14px 0;padding:18px 18px 16px;border-radius:22px;position:relative;overflow:hidden;
  background:linear-gradient(180deg,rgba(28,25,19,.94),rgba(9,9,8,.96)) padding-box,linear-gradient(160deg,rgba(246,221,140,.6),rgba(168,122,30,.08) 35%,rgba(168,122,30,.08) 70%,rgba(246,221,140,.35)) border-box;
  border:1px solid transparent;box-shadow:0 24px 50px -18px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,236,190,.08);
  animation:up .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*90ms + .25s);transition:transform .2s}
a.lux:active{transform:scale(.985)}
.lux::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(246,221,140,.07) 48%,transparent 60%);transform:translateX(-120%);animation:sweep 7s ease-in-out infinite;animation-delay:calc(var(--i,0)*1.3s + 2s);pointer-events:none}
@keyframes sweep{0%,70%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.lux-h{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:12px}
.lux-h .chev,.arow .chev{color:var(--gold);font-size:20px;letter-spacing:0;opacity:.7}
.lbl{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#8d8471}
.hero-num{font:400 40px/1.05 "Didot","Bodoni 72","Playfair Display",Georgia,serif;color:#fbf3dc;letter-spacing:-.5px;margin:4px 0 2px;font-variant-numeric:lining-nums tabular-nums}
.quiet{color:var(--mute);font-size:14px;margin-top:6px}
.cols{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;padding-top:12px;border-top:1px solid rgba(212,175,55,.16)}
.cols>div{padding-right:8px}.cols>div+div{padding-left:12px;border-left:1px solid rgba(212,175,55,.12)}
.cols .v{font-size:15px;color:#efe6cf;margin-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.delta{font-size:13px;font-weight:600;text-align:right}.delta small{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#8d8471;font-weight:500}
.delta.up{color:#8fd9a4}.delta.down{color:#ff9585}
.chart{width:100%;height:64px;margin-top:12px;display:block;overflow:visible}
.chart .draw{stroke-dasharray:900;stroke-dashoffset:900;animation:drawl 1.6s .5s cubic-bezier(.4,0,.2,1) forwards;filter:drop-shadow(0 0 4px rgba(240,210,122,.6))}
.chart .area{opacity:0;animation:fade 1s 1.2s reverse both}
.chart .dot{opacity:0;animation:pulse 2.4s 1.8s ease-in-out infinite}
@keyframes drawl{to{stroke-dashoffset:0}}
@keyframes pulse{0%{opacity:1;r:3.2}50%{opacity:.5;r:5}100%{opacity:1;r:3.2}}
.days{display:flex;justify-content:space-between;font-size:10px;color:#6f685a;margin-top:4px;letter-spacing:.1em}
.days span{width:12px;text-align:center}.days .on{color:var(--gold2);font-weight:700}
.agenda{padding-bottom:6px}
.arow{display:flex;align-items:center;gap:14px;padding:13px 0;text-decoration:none;color:inherit;border-top:1px solid rgba(212,175,55,.12);animation:up .5s both;animation-delay:calc(var(--i,0)*70ms + .5s);transition:background .2s}
.arow:active{background:rgba(212,175,55,.05)}
.aic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;border:1px solid rgba(212,175,55,.45);background:radial-gradient(circle at 30% 25%,rgba(246,221,140,.16),rgba(0,0,0,.2))}
.aic svg{width:17px;height:17px;stroke:var(--gold2)}
.arow .grow{flex:1;min-width:0;display:flex;flex-direction:column}
.at{font-size:16px;color:#f6efdc;font-weight:500}
.as{font-size:12.5px;color:#8d8471;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.av{font:400 22px/1 "Didot","Bodoni 72",Georgia,serif;color:var(--gold2);text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.av em{font:600 9.5px/1 -apple-system,sans-serif;font-style:normal;letter-spacing:.12em;text-transform:uppercase;color:#ff9585}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
.quad .lux{margin:0;min-height:156px;display:flex;flex-direction:column;padding:16px}
.qbox .lux-h{letter-spacing:.2em;margin-bottom:6px}
.qbox .aic{width:32px;height:32px}.qbox .aic svg{width:15px;height:15px}
.qv{font:400 44px/1 "Didot","Bodoni 72",Georgia,serif;color:#fbf3dc;margin-top:auto}
.qv .soon{font-size:26px;color:#8d8471}
.qs{font-size:12.5px;color:#8d8471;margin-top:6px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.qs em{display:block;font:600 10px/1.4 -apple-system,sans-serif;font-style:normal;letter-spacing:.12em;text-transform:uppercase;color:#ff9585}
/* ---- Gerald ---- */
.gdot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--goldg);color:#1a1306;font:700 15px/1 "Didot","Bodoni 72",Georgia,serif;box-shadow:0 0 14px rgba(212,175,55,.45)}
.gdot.big{width:44px;height:44px;font-size:22px}
.askbar{display:flex;align-items:center;gap:12px;width:calc(100% - 32px);max-width:560px;margin:6px auto 0;padding:10px 14px 10px 10px;border-radius:999px;cursor:pointer;color:#a59c86;font:inherit;font-size:15px;text-align:left;
  background:rgba(8,8,7,.75);border:1px solid rgba(212,175,55,.45);box-shadow:0 10px 30px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,236,190,.06);animation:up .8s .35s both;transition:transform .2s,border-color .2s}
.askbar:active{transform:scale(.98);border-color:var(--gold2)}
.askbar .chev{color:var(--gold);font-size:20px}
.gfab{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + var(--tab) + 16px);z-index:31;width:48px;height:48px;border-radius:50%;cursor:pointer;background:radial-gradient(circle at 35% 30%,#3a2f17,#14110a 70%);border:1px solid rgba(212,175,55,.55);color:#c9a24a;font:700 21px/1 "Didot","Bodoni 72",Georgia,serif;box-shadow:0 8px 22px rgba(0,0,0,.65);opacity:.92;animation:up .6s .6s both;transition:transform .2s}
.gfab:active{transform:scale(.9)}
.gsheet{display:flex;flex-direction:column;height:86vh;padding-bottom:calc(env(safe-area-inset-bottom) + 12px)}
.g-head{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid rgba(212,175,55,.2)}
.g-name{font:400 24px/1 "Didot","Bodoni 72",Georgia,serif;color:var(--gold2)}
.g-log{flex:1;overflow-y:auto;padding:14px 2px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.g-hello{font:400 22px/1.35 "Didot","Bodoni 72",Georgia,serif;color:#efe6cf;margin:auto 0 6px}
.gm{max-width:86%;padding:10px 13px;border-radius:16px;font-size:15px;line-height:1.45;animation:up .3s both}
.gm.user{align-self:flex-end;background:var(--goldg);color:#1a1306;border-bottom-right-radius:5px;font-weight:500}
.gm.assistant{align-self:flex-start;background:rgba(255,255,255,.04);border:1px solid rgba(212,175,55,.25);color:#efe6cf;border-bottom-left-radius:5px}
.gm ul{margin:4px 0;padding-left:18px}.gm li{margin:2px 0}
.gm.typing{display:flex;gap:5px;padding:14px}
.gm.typing i{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:blink 1.2s infinite}
.gm.typing i:nth-child(2){animation-delay:.2s}.gm.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.g-sugg{display:flex;flex-wrap:wrap;gap:8px;padding:6px 0 10px}
.g-sugg button{background:rgba(0,0,0,.4);border:1px solid rgba(212,175,55,.35);color:var(--gold2);border-radius:999px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer}
.g-in{display:flex;gap:8px;padding-top:10px;border-top:1px solid rgba(212,175,55,.2)}
/* ---- Section pages: match Home ---- */
main h1{font:400 38px/1.05 "Didot","Bodoni 72",Georgia,serif;letter-spacing:-.3px;margin:4px 0 16px;background:none;-webkit-background-clip:border-box;background-clip:border-box;color:#fbf3dc;animation:none}
main h1::before{content:attr(data-eyebrow);display:block;font:600 11px/1 -apple-system,sans-serif;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
.top{min-height:40px;margin:4px 0 6px}
.card,.stat,.list{border-radius:22px;background:linear-gradient(180deg,rgba(28,25,19,.94),rgba(9,9,8,.96)) padding-box,linear-gradient(160deg,rgba(246,221,140,.6),rgba(168,122,30,.08) 35%,rgba(168,122,30,.08) 70%,rgba(246,221,140,.35)) border-box;border:1px solid transparent;box-shadow:0 24px 50px -18px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,236,190,.08);backdrop-filter:none;-webkit-backdrop-filter:none}
.card{padding:18px}
.card>.row .grow>div:first-child[style*="font-weight"]{font-size:17px;color:#f6efdc}
.list .item{padding:15px 18px}
.list .item .t{font-size:16px;color:#f6efdc}
.stat{padding:16px 18px}
.stat .k{font-size:10.5px;letter-spacing:.18em;color:#8d8471}
.stat .v{font:400 30px/1.1 "Didot","Bodoni 72",Georgia,serif;color:#fbf3dc;margin-top:6px}
.btn.ghost{background:rgba(8,8,7,.75);border:1px solid rgba(212,175,55,.45);color:var(--gold2);border-radius:999px;padding:8px 16px}
.btn.ghost.sm{padding:7px 14px}
.seg{border-radius:999px;padding:4px}
.seg button{border-radius:999px}
.empty{font:italic 400 18px/1.4 "Didot","Bodoni 72",Georgia,serif;color:#8d8471;padding:40px 10px}
.duefield{display:flex;align-items:center;gap:10px;margin-top:10px;padding:0 4px 0 14px;border:1px solid rgba(212,175,55,.28);border-radius:12px;background:rgba(0,0,0,.55)}
.duefield span{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#8d8471;white-space:nowrap}
.duefield input{border:0;background:transparent;box-shadow:none;padding:11px 8px;min-height:44px;flex:1;text-align:right;color:var(--gold2)}
.duefield input:focus{box-shadow:none}
/* ---- Photo Vault ---- */
.pv-albums{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pv-album{background:none;border:0;padding:0;text-align:left;color:inherit;cursor:pointer;font:inherit;animation:up .5s both;animation-delay:var(--d)}
.pv-cover{aspect-ratio:1;border-radius:18px;overflow:hidden;display:grid;place-items:center;background:linear-gradient(160deg,#1c1913,#0a0908);border:1px solid rgba(212,175,55,.4);box-shadow:0 16px 30px -12px rgba(0,0,0,.9)}
.pv-cover img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.pv-album:active .pv-cover img{transform:scale(1.05)}
.pv-cover span svg{width:34px;height:34px;stroke:var(--gold);opacity:.7}
.pv-aname{font:400 19px/1.2 "Didot","Bodoni 72",Georgia,serif;color:#f6efdc;margin:10px 2px 2px}
.pv-acount{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#8d8471;margin:0 2px}
.pv-add{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:0 0 14px;padding:13px}
.pv-add svg{width:18px;height:18px;stroke:#1a1306}
.pv-prog{position:relative;height:30px;border-radius:999px;border:1px solid rgba(212,175,55,.4);overflow:hidden;margin-bottom:14px;background:rgba(0,0,0,.5)}
.pv-prog i{position:absolute;inset:0 auto 0 0;background:var(--goldg);opacity:.35;transition:width .3s}
.pv-prog span{position:relative;display:block;text-align:center;line-height:28px;font-size:13px;color:var(--gold2)}
.pv-tools{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:14px;display:flex;gap:8px}
.pv-tools button,.pv-move button{background:rgba(0,0,0,.6);border:1px solid rgba(212,175,55,.45);color:var(--gold2);border-radius:999px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer}
.pv-tools .bad{color:#ff9585;border-color:rgba(255,122,107,.45)}
.pv-move{position:absolute;top:calc(env(safe-area-inset-top) + 58px);left:14px;right:14px;display:flex;flex-wrap:wrap;gap:8px}
.pv-chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.pv-chips::-webkit-scrollbar{display:none}
.pv-chips button{flex:none;background:rgba(8,8,7,.75);border:1px solid rgba(212,175,55,.4);color:var(--gold2);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.pv-chips button.on{background:var(--goldg);color:#1a1306;border-color:transparent;font-weight:600}
.pv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;border-radius:16px;overflow:hidden}
.pv-ph{position:relative;aspect-ratio:1;border:0;padding:0;background:#111;cursor:pointer;overflow:hidden;animation:up .45s both;animation-delay:var(--d)}
.pv-ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.pv-ph:active img{transform:scale(1.06)}
.pv-play{position:absolute;right:6px;bottom:6px;color:#fff;font-size:12px;text-shadow:0 1px 4px #000}
.pv-view{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.96);display:flex;align-items:center;justify-content:center;animation:fade .2s}
.pv-view img,.pv-view video{max-width:100%;max-height:86vh;object-fit:contain}
.pv-bar{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 16px);display:flex;justify-content:space-between;padding:0 20px;color:#bfb49a;font-size:13px;letter-spacing:.08em}
.pv-x{position:absolute;top:calc(env(safe-area-inset-top) + 10px);right:14px;width:42px;height:42px;border-radius:50%;border:1px solid rgba(212,175,55,.45);background:rgba(0,0,0,.6);color:var(--gold2);font-size:24px;cursor:pointer}
.pv-nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:64px;border:0;background:none;color:rgba(246,221,140,.8);font-size:40px;cursor:pointer}
.pv-nav.l{left:4px}.pv-nav.r{right:4px}
/* Bottom tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:30;padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);background:linear-gradient(180deg,rgba(10,10,10,.75),rgba(4,4,4,.96));backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border-top:1px solid rgba(212,175,55,.3)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);position:relative}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:#7d7564;text-decoration:none;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;transition:color .25s,transform .2s;position:relative;z-index:1}
nav.tabs a svg{width:23px;height:23px;stroke:currentColor;transition:transform .3s cubic-bezier(.2,.8,.2,1),filter .3s}
nav.tabs a.on{color:var(--gold2)}
nav.tabs a.on svg{transform:translateY(-2px) scale(1.1);filter:drop-shadow(0 0 6px rgba(212,175,55,.7))}
nav.tabs a:active{transform:scale(.9)}
nav.tabs .ind{position:absolute;top:-9px;height:2px;width:20%;background:var(--goldg);border-radius:2px;box-shadow:0 0 10px rgba(212,175,55,.8);transition:left .35s cubic-bezier(.2,.8,.2,1),opacity .3s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Gun Vault */
.gv-seg button{padding:9px 2px;font-size:13px}
.gv-tot{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#8d8471;margin:2px 4px 10px}
.gv-tot span:last-child{color:var(--gold2)}
.gv-list{display:flex;flex-direction:column;gap:12px}
.gv-card{border-radius:20px;background:linear-gradient(180deg,rgba(28,25,19,.94),rgba(9,9,8,.96)) padding-box,linear-gradient(160deg,rgba(246,221,140,.5),rgba(168,122,30,.08) 35%,rgba(168,122,30,.08) 70%,rgba(246,221,140,.3)) border-box;border:1px solid transparent;box-shadow:0 18px 40px -18px rgba(0,0,0,.9);overflow:hidden;animation:up .45s both;animation-delay:var(--d)}
.gv-head{display:flex;align-items:center;gap:13px;width:100%;background:none;border:0;color:inherit;font:inherit;text-align:left;padding:12px 14px 12px 12px;cursor:pointer}
.gv-thumb{flex:none;width:64px;height:64px;border-radius:14px;background:#f2eee6;display:grid;place-items:center;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(212,175,55,.35)}
.gv-thumb img{width:100%;height:100%;object-fit:contain;padding:4px;box-sizing:border-box}
.gv-thumb svg{width:26px;height:26px;stroke:#8d6a1f}
.gv-head .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.gv-name{font:400 18px/1.2 "Didot","Bodoni 72",Georgia,serif;color:#f6efdc;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.gv-meta{font-size:12.5px;color:#8d8471;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gv-val{flex:none;font:400 17px "Didot","Bodoni 72",Georgia,serif;color:var(--gold2);font-variant-numeric:lining-nums tabular-nums}
.gv-body{padding:2px 14px 14px;border-top:1px solid rgba(212,175,55,.14);animation:fade .25s}
.gv-strip{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.gv-strip::-webkit-scrollbar{display:none}
.gv-ph{flex:none;width:96px;background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer;text-decoration:none;display:flex;flex-direction:column;gap:4px}
.gv-ph img,.gv-ph>span{width:96px;height:96px;border-radius:12px;object-fit:contain;background:#f2eee6;display:grid;place-items:center;box-sizing:border-box;padding:3px}
.gv-ph small{font-size:11px;color:#8d8471;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.gv-ph.pdf>span{background:linear-gradient(160deg,#2a2418,#0d0c0a);border:1px solid rgba(212,175,55,.45);color:var(--gold2);font-weight:700;letter-spacing:.2em;font-size:13px}
.gv-ph.add>span{background:rgba(0,0,0,.4);border:1px dashed rgba(212,175,55,.5);color:var(--gold2);font-size:26px}
.gv-serial{display:flex;justify-content:space-between;align-items:center;width:100%;margin:10px 0 2px;padding:11px 14px;border-radius:12px;background:rgba(0,0,0,.45);border:1px solid rgba(212,175,55,.3);color:inherit;font:inherit;cursor:pointer}
.gv-serial span{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#8d8471}
.gv-serial b{font-family:ui-monospace,Menlo,monospace;color:#f6efdc;letter-spacing:.08em;font-weight:500}
.gv-facts{margin-top:6px}
.gv-kv{display:flex;justify-content:space-between;gap:14px;padding:8px 2px;border-bottom:1px solid rgba(212,175,55,.08);font-size:14px}
.gv-kv span{color:#8d8471;text-transform:capitalize}.gv-kv b{font-weight:500;color:#efe6cf;text-align:right}
.gv-grid{display:block}
.gv-grid .gv-kv{font-size:13px}
.gv-sec{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin:16px 2px 6px}
.gv-lines{border-radius:12px;background:rgba(0,0,0,.35);border:1px solid rgba(212,175,55,.14)}
.gv-line{display:flex;align-items:center;gap:10px;padding:9px 12px;font-size:14px;color:#efe6cf}
.gv-line+.gv-line{border-top:1px solid rgba(212,175,55,.08)}
.gv-line img{width:34px;height:34px;border-radius:8px;object-fit:contain;background:#f2eee6;flex:none}
.gv-line .grow{flex:1;min-width:0}.gv-line small{display:block;font-size:11.5px;color:#8d8471;margin-top:2px}
.gv-line b{font-weight:500;color:var(--gold2);font-variant-numeric:tabular-nums;white-space:nowrap}
.gv-row{display:flex;align-items:center;gap:8px;padding:8px 0}.gv-row.wrap{flex-wrap:wrap}
.gv-link{background:rgba(8,8,7,.75);border:1px solid rgba(212,175,55,.4);color:var(--gold2);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.gv-notes{font-size:14px;color:#d9d0bb;white-space:pre-wrap;line-height:1.45}
.gv-acts{display:flex;justify-content:flex-end;margin-top:14px}
.gv-efs{display:grid;grid-template-columns:1fr 1fr;column-gap:10px}
.gv-ef:first-child{grid-column:1/-1}
.gv-rows{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.gv-er{display:flex;gap:6px;align-items:center}
.gv-er input{margin:0;min-width:0}.gv-er .grow{flex:1}.gv-er .num{width:64px;flex:none}
.gv-x{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,122,107,.4);background:none;color:var(--bad);font-size:18px;cursor:pointer}
.gv-ptype{font-size:11px;color:#8d8471;letter-spacing:.1em}.gv-rm{font-size:12px;color:var(--bad);white-space:nowrap;display:flex;gap:4px;align-items:center;margin:0}
.gv-rm input{width:auto;margin:0}
.gv-fits{display:flex;flex-direction:column;gap:6px;max-height:180px;overflow:auto;padding:8px 10px;border-radius:12px;background:rgba(0,0,0,.35);border:1px solid rgba(212,175,55,.2)}
.gv-fits label{display:flex;gap:8px;align-items:center;margin:0;font-size:14px;color:#efe6cf;text-transform:none;letter-spacing:0}
.gv-fits input{width:auto;margin:0}

/* Passwords */
.qlock svg{width:30px;height:30px;stroke:var(--gold2);opacity:.85;margin-top:6px}
.pw-lockcard{padding:26px 20px}
.pw-lockic{width:58px;height:58px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(212,175,55,.5);background:rgba(0,0,0,.4)}
.pw-lockic svg{width:26px;height:26px;stroke:var(--gold2)}
.pw-lockcard input{width:100%;box-sizing:border-box}
.pw-search{width:100%;box-sizing:border-box;margin:6px 0 14px}
.pw-item{cursor:pointer;align-items:center}
.pw-av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--goldg);color:#1a1306;font:600 17px "Didot","Bodoni 72",Georgia,serif;margin-right:12px}
.pw-row{display:flex;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid rgba(212,175,55,.12)}
.pw-row .grow{flex:1;min-width:0}
.pw-v{font-size:16px;color:#f6efdc;margin-top:3px;word-break:break-all}
.pw-h{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin:18px 4px 8px;font-weight:600}
.pw-h span{color:#8d8471}
.pw-av.logo{background:#f4f1ea;overflow:hidden}
.pw-av.logo img{width:24px;height:24px;object-fit:contain}
.pw-dh{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.pw-dh .pw-av{margin-right:0;width:46px;height:46px}
.pw-dh .pw-av.logo img{width:30px;height:30px}
.mono{font-family:ui-monospace,Menlo,monospace;letter-spacing:.03em}

/* Tab bar v2: floating black-glass capsule */
nav.tabs{left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 8px);padding:6px;border:1px solid rgba(212,175,55,.38);border-radius:26px;background:linear-gradient(180deg,rgba(22,20,15,.82),rgba(6,6,5,.94));box-shadow:0 18px 40px -10px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,236,190,.08)}
nav.tabs .in{max-width:560px}
nav.tabs a{padding:7px 0 6px;font-size:9.5px;letter-spacing:.1em;gap:3px}
nav.tabs a svg{width:21px;height:21px}
nav.tabs a.on svg{transform:none;filter:none}
nav.tabs a.on{color:#1a1306}
nav.tabs .ind{top:0;bottom:0;height:auto;width:calc(20% - 8px);border-radius:20px;background:var(--goldg);box-shadow:0 4px 16px rgba(212,175,55,.35)}
body{padding-bottom:calc(env(safe-area-inset-bottom) + var(--tab) + 22px)}
.gfab{bottom:calc(env(safe-area-inset-bottom) + var(--tab) + 10px)}
.more-modal .sheet{padding-top:16px}
.more-h{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);font-weight:600;margin:2px 4px 14px}
.more-g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.more-t{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px 12px;border-radius:18px;text-decoration:none;color:inherit;background:linear-gradient(180deg,rgba(28,25,19,.94),rgba(9,9,8,.96)) padding-box,linear-gradient(160deg,rgba(246,221,140,.5),rgba(168,122,30,.1) 45%,rgba(246,221,140,.3)) border-box;border:1px solid transparent;animation:up .35s both}
.more-t svg{width:22px;height:22px;stroke:var(--gold2);margin-bottom:6px}
.more-t b{font:400 16px/1.15 "Didot","Bodoni 72",Georgia,serif;color:#f6efdc}
.more-t small{font-size:11.5px;color:#8d8471}

/* Trim, compact */
.lux-sm{padding:14px 16px 12px}
.lux-sm .lux-h{margin-bottom:8px}
.tsm{display:flex;align-items:flex-end;gap:14px}
.tsm-l{flex:none}
.tsm-num{font:400 28px/1.05 "Didot","Bodoni 72",Georgia,serif;color:#fbf3dc;margin:2px 0 4px;font-variant-numeric:lining-nums tabular-nums}
.tsm .delta{font-size:12px;text-align:left}
.tsm .delta small{display:inline;font-size:10px}

.tsm-cols i{font-style:normal;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#8d8471;margin-right:4px}
/* Gun Vault hero */
.gv-h1{position:relative;z-index:2}
.top{position:relative;z-index:3}
.gv-hero{position:relative;margin:calc(-64px - env(safe-area-inset-top) - 10px) -16px 0;height:calc(min(100vw,720px) * .8 + env(safe-area-inset-top));overflow:hidden;z-index:0;-webkit-mask-image:linear-gradient(180deg,#000 85%,transparent);mask-image:linear-gradient(180deg,#000 85%,transparent)}
.gv-hero picture{position:absolute;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top) + 4px)}.gv-hero img{width:100%;height:100%;object-fit:cover;object-position:56% 0%;display:block;-webkit-user-select:none;user-select:none}
.gv-hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#050505 0,#050505 env(safe-area-inset-top),rgba(5,5,5,0) calc(env(safe-area-inset-top) + 40px)),linear-gradient(0deg,rgba(5,5,5,.92) 0,rgba(5,5,5,.6) 70px,rgba(5,5,5,0) 40%);z-index:1;pointer-events:none}
.gv-eb{font-size:9.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);font-weight:600}
.gv-title{font:400 30px/1.05 "Didot","Bodoni 72",Georgia,serif;color:#fbf3dc;margin-top:6px;text-shadow:0 4px 18px rgba(0,0,0,.8)}
.gv-hero-txt{position:absolute;left:18px;right:18px;bottom:22px;z-index:2;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.gv-hero-txt .hero-num{font-size:26px;margin:2px 0 0;text-align:right;text-shadow:0 4px 18px rgba(0,0,0,.8)}
.gv-sum{margin-top:4px;padding:14px 16px}

/* Calendar */
.cal-card{padding:14px 12px 12px}
.cal-top{display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px}
.cal-top .icon{font-size:26px;color:var(--gold2);width:40px;height:36px}
.cal-mo{font:400 22px "Didot","Bodoni 72",Georgia,serif;color:#f6efdc}
.cal-w,.cal-g{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.cal-w span{font-size:10.5px;letter-spacing:.14em;color:#8d8471;padding:4px 0}
.cal-d{background:none;border:0;color:#efe6cf;font:inherit;font-size:15px;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border-radius:12px;font-variant-numeric:tabular-nums}
.cal-d span{width:32px;height:32px;display:grid;place-items:center;border-radius:50%}
.cal-d.out{color:#4f4a40}
.cal-d.today span{border:1px solid var(--gold);color:var(--gold2)}
.cal-d.sel span{background:var(--goldg);color:#1a1306;font-weight:700;border:0}
.cal-d i{display:flex;gap:3px;height:5px}.cal-d i b{width:5px;height:5px;border-radius:50%}
.cal-today{display:block;margin:8px auto 0;background:none;border:0;color:var(--gold2);font:inherit;font-size:13px;cursor:pointer}
.cal-ev{align-items:center;gap:12px;cursor:pointer;position:relative}
.cal-ev.done .t{text-decoration:line-through;opacity:.55}
.cal-bar{flex:none;width:4px;align-self:stretch;border-radius:4px;min-height:34px}
.cal-time{flex:none;width:66px;font-size:13.5px;color:var(--gold2);font-variant-numeric:tabular-nums;line-height:1.25}
.cal-time small{display:block;font-size:11.5px;color:#8d8471}
.cal-time .cal-when{color:#efe6cf;font-size:12px;letter-spacing:.02em}
.cal-kinds,.cal-rems{display:flex;flex-wrap:wrap;gap:7px;margin:4px 0 8px}
.cal-kind,.cal-rem{margin:0;text-transform:none;letter-spacing:0}
.cal-kind input,.cal-rem input{position:absolute;opacity:0;pointer-events:none}
.cal-kind span,.cal-rem span{display:inline-block;padding:7px 12px;border-radius:999px;border:1px solid rgba(212,175,55,.3);font-size:13.5px;color:#cfc6b0;cursor:pointer}
.cal-kind span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:7px;vertical-align:1px}
.cal-kind input:checked+span,.cal-rem input:checked+span{background:var(--goldg);color:#1a1306;border-color:transparent;font-weight:600}
.cal-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.cal-2>div{min-width:0}
form[data-form="ev-save"] input,form[data-form="ev-save"] select{width:100%;max-width:100%;min-width:0;box-sizing:border-box;display:block}
form[data-form="ev-save"] input[type=date],form[data-form="ev-save"] input[type=time]{-webkit-appearance:none;appearance:none;min-height:46px;text-align:left}
form[data-form="ev-save"] input[type=date]::-webkit-date-and-time-value,form[data-form="ev-save"] input[type=time]::-webkit-date-and-time-value{text-align:left}
.cal-days{display:flex;justify-content:space-between;gap:6px;margin:10px 0 2px}
.cal-days[hidden],.cal-until[hidden]{display:none}
.cal-dw{flex:1}.cal-dw span{display:grid;place-items:center;width:100%;height:40px;padding:0;border-radius:50%;max-width:42px;margin:0 auto}
.cal-dh{display:flex;gap:12px;align-items:stretch;margin-bottom:10px}
.hc-row{display:flex;align-items:center;gap:10px;padding:7px 0}
.hc-row+.hc-row{border-top:1px solid rgba(212,175,55,.1)}
.hc-when{flex:none;width:92px;font-size:12.5px;color:#efe6cf;line-height:1.2}
.hc-when small{display:block;color:var(--gold2);font-size:12px}
.hc-t{flex:1;min-width:0;font-size:15px;color:#f6efdc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc-row .cal-bar{min-height:28px}
</style>
</head>
